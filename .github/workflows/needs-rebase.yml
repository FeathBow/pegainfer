name: Label pull requests that need a rebase

on:
  push:
    branches: [main]
  # Gives fork PRs a label-writing token; no PR code is checked out.
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Mark conflicting pull requests
    runs-on: ubuntu-latest

    steps:
      - name: Add or remove the needs-rebase label
        uses: eps1lon/actions-label-merge-conflict@v3.1.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          dirtyLabel: needs-rebase
          commentOnDirty: >-
            This pull request has merge conflicts with main. Please rebase it so
            it can be reviewed and merged.
